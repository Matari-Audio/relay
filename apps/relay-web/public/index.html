<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RELAY · Listen</title>
<link rel="preload" href="/fonts/Barlow-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Barlow; font-weight: 600; font-display: swap; src: url(/fonts/Barlow-SemiBold.woff2) format("woff2"); }
@font-face { font-family: Barlow; font-weight: 700; font-display: swap; src: url(/fonts/Barlow-Bold.woff2) format("woff2"); }
:root {
  --bg: #050505; --surface: #0b0b0b; --field: #161616; --line: #1f1f1f; --text: #ffffff; --dim: #8a8a8a;
  --accent: #ffffff; --ink: #000000; --ok: #c8ff00; --warn: #ffb400; --bad: #ff3b30;
  --mono: ui-monospace, "Martian Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 600 13px/1.3 Barlow, system-ui, sans-serif; }
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
main { width: min(420px, 100%); display: grid; grid-template-columns: 1fr auto; gap: 12px;
  padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .16em; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.lamp.ok { background: var(--ok); } .lamp.warn { background: var(--warn); } .lamp.bad { background: var(--bad); }
.controls { display: grid; gap: 8px; align-content: start; min-width: 0; }
label { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.weld { display: flex; border: 1px solid var(--line); border-radius: 7px; background: var(--field); }
.weld:focus-within { border-color: var(--accent); }
.weld input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; outline: none; }
.weld button { width: 36px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--dim); display: grid; place-items: center; cursor: pointer; }
.weld button:hover, .weld button:focus-visible { color: var(--text); outline: none; }
.weld svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
#listen { height: 40px; border: 0; border-radius: 7px; background: var(--accent); color: var(--ink); font: 700 13px Barlow, sans-serif;
  letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
#listen:hover { filter: brightness(1.12); } #listen:active { transform: translateY(1px); }
#listen:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
#listen[aria-pressed="true"] { background: var(--field); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
#status { color: var(--dim); min-height: 17px; }
#db { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; }
#db small { font-size: 11px; color: var(--dim); }
.meters { display: flex; gap: 1px; }
.ch { display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 4px; color: var(--dim); font-size: 11px; }
.rail { position: relative; width: 4px; height: 100%; min-height: 180px; border-radius: 2px; overflow: hidden;
  background: linear-gradient(to top, var(--text) 0 98.3%, var(--bad) 98.3%); }
.cover { position: absolute; inset: 0; background: var(--field); transform-origin: top; will-change: transform; }
@media (prefers-reduced-motion: reduce) { #listen:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header><span class="lamp" id="lamp"></span>RELAY</header>
  <form class="controls" id="form">
    <label for="room">Room</label>
    <div class="weld">
      <input id="room" autocomplete="off" spellcheck="false" placeholder="big-filthy-papaya" enterkeyhint="go">
      <button type="button" id="copy" aria-label="Copy listen link" title="Copy link">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 3.5v-1h-8v8h1"/></svg>
      </button>
    </div>
    <label for="pw">Password</label>
    <div class="weld">
      <input id="pw" type="password" autocomplete="off" placeholder="optional">
      <button type="button" id="eye" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/><path id="slash" style="display:none" d="M2.5 13.5l11-11"/></svg>
      </button>
    </div>
    <button id="listen" aria-pressed="false">Listen</button>
    <div id="status" role="status" aria-live="polite">Press Listen</div>
    <div id="db" aria-label="Peak level">−∞ <small>dBFS</small></div>
  </form>
  <div class="meters" aria-hidden="true">
    <div class="ch"><div class="rail"><div class="cover" id="mL"></div></div>L</div>
    <div class="ch"><div class="rail"><div class="cover" id="mR"></div></div>R</div>
  </div>
</main>
<audio id="out" autoplay playsinline></audio>
<script type="module" src="/listen.js"></script>
</body>
</html>
