name: Contracts CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Buf format, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
          pr_comment: false

      - name: Check formatting
        run: buf format --diff --exit-code proto

      - name: Lint contracts
        run: buf lint proto

      - name: Build contracts
        run: buf build proto

      - name: Regenerate consumers
        working-directory: proto
        run: buf generate

      - name: Check generated consumers
        run: git diff --exit-code -- crates/relay-protocol/src/generated packages/protocol/src/generated

      # Breaking checks intentionally begin only after the first schema baseline exists.
