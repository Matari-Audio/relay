name: Rust CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/gate-setup.sh

      - name: Install libopus on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install opus
          opus_prefix="$(brew --prefix opus)"
          brew list --versions opus

          echo "LIBRARY_PATH=$opus_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$opus_prefix/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$opus_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "OPUS_PREFIX=$opus_prefix" >> "$GITHUB_ENV"

      - name: Install libopus 1.6.1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgCommit = "eb2d21971e9d95cc0688eaf7e221cd9e5c8ee6be"
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "relay-vcpkg"

          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $vcpkgCommit
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$vcpkgRoot\vcpkg.exe" install "opus:x64-windows" --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "libopus installation failed" }
          & "$vcpkgRoot\vcpkg.exe" list "opus:x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "libopus version query failed" }

          $opusRoot = Join-Path $vcpkgRoot "installed\x64-windows"
          "LIB=$opusRoot\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPUS_ROOT=$opusRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$opusRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Smoke-check libopus on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/opus-version.c" <<'EOF'
          #include <stdio.h>
          #include <opus/opus.h>
          int main(void) {
              puts(opus_get_version_string());
              return 0;
          }
          EOF
          cc "$RUNNER_TEMP/opus-version.c" $(pkg-config --cflags --libs opus) \
            -o "$RUNNER_TEMP/opus-version"
          version="$($RUNNER_TEMP/opus-version)"
          echo "$version"
          [[ "$version" =~ ^libopus\ 1\.6(\.|$) ]]

      - name: Smoke-check libopus on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/opus-version.c" <<'EOF'
          #include <stdio.h>
          #include <opus/opus.h>
          int main(void) {
              puts(opus_get_version_string());
              return 0;
          }
          EOF
          cc "$RUNNER_TEMP/opus-version.c" \
            -I"$OPUS_PREFIX/include" -L"$OPUS_PREFIX/lib" -lopus \
            -o "$RUNNER_TEMP/opus-version"
          version="$($RUNNER_TEMP/opus-version)"
          echo "$version"
          [[ "$version" =~ ^libopus\ 1\.6(\.|$) ]]

      - name: Smoke-check libopus on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "opus-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          @'
          cmake_minimum_required(VERSION 3.20)
          project(opus_version C)
          add_executable(opus-version main.c)
          target_include_directories(opus-version PRIVATE "${OPUS_ROOT}/include")
          target_link_directories(opus-version PRIVATE "${OPUS_ROOT}/lib")
          target_link_libraries(opus-version PRIVATE opus)
          '@ | Set-Content -Path (Join-Path $smokeRoot "CMakeLists.txt")
          @'
          #include <stdio.h>
          #include <opus/opus.h>
          int main(void) {
              puts(opus_get_version_string());
              return 0;
          }
          '@ | Set-Content -Path (Join-Path $smokeRoot "main.c")
          cmake -S $smokeRoot -B "$smokeRoot\build" -A x64 "-DOPUS_ROOT=$($env:OPUS_ROOT -replace '\\', '/')"
          if ($LASTEXITCODE -ne 0) { throw "libopus smoke-check configure failed" }
          cmake --build "$smokeRoot\build" --config Release
          if ($LASTEXITCODE -ne 0) { throw "libopus smoke-check link failed" }
          $version = & "$smokeRoot\build\Release\opus-version.exe"
          if ($LASTEXITCODE -ne 0) { throw "libopus smoke-check load failed" }
          Write-Host $version
          if ($version -notmatch '^libopus 1\.6(?:\.|$)') {
            throw "expected libopus 1.6.x, loaded $version"
          }

      - name: Install Rust toolchain and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: rust@1.92.0+rustfmt+clippy,cargo-nextest@0.9.143
          fallback: none

      - name: Install cargo-deny 0.20.2
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none

      - name: Check dependency policy
        if: runner.os == 'Linux'
        run: cargo deny --locked check licenses advisories sources bans

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run tests with nextest
        run: cargo nextest run --locked --profile ci --workspace --all-targets --all-features

      - name: Run release-mode tests with nextest
        if: runner.os == 'Linux'
        run: cargo nextest run --locked --release --profile ci --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
