[package]
name = "relay-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false
description = "RELAY link: LAN PCM over UDP and a block-based playout buffer"

[dependencies]
rtrb = "0.4"
rubato = { version = "5", default-features = false }
sha2 = "0.10"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
opus-rs = "0.1.34"
mdns-sd = { version = "0.21", default-features = false }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
igd-next = { version = "0.17", default-features = false }
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
