[package]
name = "relay-plugin"
version = "0.5.2"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "RELAY: share the track you're on with another DAW or a browser"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Counting allocator for the real-time tests: `cargo test --features rt-paranoid`.
rt-paranoid = ["moose/rt-paranoid"]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys", "moose/clap"]
vst3 = ["dep:moose-vst3", "moose/vst3"]
# AU v2 (macOS): `cargo moose build --au2`.
au = ["dep:moose-au", "moose/au"]
# AAX (macOS/Windows): `cargo moose build --aax`.
aax = ["moose/aax"]

[dependencies]
relay-core = { path = "../core" }
moose = { git = "https://github.com/Matari-Audio/moose", default-features = false, features = ["mui"] }
moose-core = { git = "https://github.com/Matari-Audio/moose" }
moose-clap = { git = "https://github.com/Matari-Audio/moose", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", optional = true }
moose-au = { git = "https://github.com/Matari-Audio/moose", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI", features = ["reporting"] }

[dev-dependencies]
moose-test = { git = "https://github.com/Matari-Audio/moose" }
mui-headless = { git = "https://github.com/Matari-Audio/MUI" }
moose-params = { git = "https://github.com/Matari-Audio/moose" }
