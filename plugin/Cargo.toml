[package]
name = "relay-plugin"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false
description = "RELAY: share the track you're on with another DAW or a browser"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:truce-clap", "dep:clap-sys", "truce/clap"]
vst3 = ["dep:truce-vst3", "truce/vst3"]

[dependencies]
relay-core = { path = "../core" }
truce = { version = "6.3", default-features = false }
truce-core = "6.3"
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI" }
mui-truce = { git = "https://github.com/Matari-Audio/MUI" }

[dev-dependencies]
mui-vello = { git = "https://github.com/Matari-Audio/MUI", features = ["cpu"] }
truce-params = "6.3"
png = "0.17"
