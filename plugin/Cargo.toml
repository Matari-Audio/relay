[package]
name = "relay-plugin"
version = "0.5.1"
edition.workspace = true
license.workspace = true
publish = false
description = "RELAY: share the track you're on with another DAW or a browser"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys", "moose/clap"]
vst3 = ["dep:moose-vst3", "moose/vst3"]
# AU v2 (macOS): `cargo moose build --au2`.
au = ["dep:moose-au", "moose/au"]

[dependencies]
relay-core = { path = "../core" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", default-features = false, features = ["mui"] }
moose-core = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497" }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
moose-au = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI" }

[dev-dependencies]
mui-vello = { git = "https://github.com/Matari-Audio/MUI", features = ["cpu"] }
moose-params = { git = "https://github.com/Matari-Audio/moose", rev = "bffa4677d0b82119d38566ce7e932dc5c463d497" }
png = "0.17"
