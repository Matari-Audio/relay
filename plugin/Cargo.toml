[package]
name = "relay-plugin"
version = "0.5.2"
edition.workspace = true
license.workspace = true
publish = false
description = "RELAY: share the track you're on with another DAW or a browser"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys", "moose/clap"]
vst3 = ["dep:moose-vst3", "moose/vst3"]
# AU v2 (macOS): `cargo moose build --au2`.
au = ["dep:moose-au", "moose/au"]

[dependencies]
relay-core = { path = "../core" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3", default-features = false, features = ["mui"] }
moose-core = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3" }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3", optional = true }
moose-au = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI", rev = "7ecbec645affb8a81216854688a2e1f0cf6944e9", features = ["reporting"] }

[dev-dependencies]
mui-vello = { git = "https://github.com/Matari-Audio/MUI", rev = "7ecbec645affb8a81216854688a2e1f0cf6944e9", features = ["cpu"] }
moose-params = { git = "https://github.com/Matari-Audio/moose", rev = "44e39845d7d78d03612a8d17e9538b3481dcc9e3" }
png = "0.17"
