[package]
name = "relay-plugin"
version = "0.5.1"
edition.workspace = true
license.workspace = true
publish = false
description = "RELAY: share the track you're on with another DAW or a browser"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys", "moose/clap"]
vst3 = ["dep:moose-vst3", "moose/vst3"]
# AU v2 (macOS): `cargo moose build --au2`.
au = ["dep:moose-au", "moose/au"]

[dependencies]
relay-core = { path = "../core" }
moose = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381", default-features = false, features = ["mui"] }
moose-core = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381" }
moose-clap = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381", optional = true }
moose-vst3 = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381", optional = true }
moose-au = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381", optional = true }
clap-sys = { version = "0.5", optional = true }
mui = { git = "https://github.com/Matari-Audio/MUI", features = ["reporting"] }

[dev-dependencies]
mui-vello = { git = "https://github.com/Matari-Audio/MUI", features = ["cpu"] }
moose-params = { git = "https://github.com/Matari-Audio/moose", rev = "9a6a944373a2773f3fbf33bbfd304510ac3ee381" }
png = "0.17"
