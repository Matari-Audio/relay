# Generated by tools/mirror_manifests.py from the monorepo's root Cargo.toml: this
# mirror's standalone workspace. copybara exports it as Cargo.toml. Edit the root, not this.

[workspace]
resolver = "3"
members = [
    "core",
    "plugin",
]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package."relay-core"]
opt-level = 0

[profile.dev.package."relay-plugin"]
opt-level = 0

[profile.release]
lto = "thin"
strip = "symbols"
panic = "unwind"
