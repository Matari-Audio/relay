[workspace]
members = ["core", "plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Matari-Audio/relay"

[profile.release]
lto = "thin"

[profile.dev]
debug = "line-tables-only"
incremental = true

# Opus and DTLS are too slow unoptimised for a debug plugin to keep up.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

# BEGIN tools/patches.py --manifests: blaze reads only manifest [patch] tables
[patch."https://github.com/Matari-Audio/MUI"]
moose-baseview = { path = "../../frameworks/mui/vendor/moose-baseview" }
mui = { path = "../../frameworks/mui/crates/mui" }
mui-baseview = { path = "../../frameworks/mui/crates/mui-baseview" }
mui-headless = { path = "../../frameworks/mui/crates/mui-headless" }
mui-native-dialog = { path = "../../frameworks/mui/crates/mui-native-dialog" }
mui-text = { path = "../../frameworks/mui/crates/mui-text" }
mui-vello = { path = "../../frameworks/mui/crates/mui-vello" }

[patch."https://github.com/Matari-Audio/Matari-Access"]
