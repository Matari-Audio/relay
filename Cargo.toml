[workspace]
members = [
    "apps/audio-lab",
    "crates/relay-audio",
    "crates/relay-clock",
    "crates/relay-domain",
    "crates/relay-jitter",
    "crates/relay-opus",
    "crates/relay-opus-sys",
    "crates/relay-protocol",
    "crates/relay-resample",
    "crates/relay-rt",
    "crates/relay-session",
    "crates/relay-testkit",
    "crates/relay-transport",
    "crates/relay-libdatachannel-sys",
    "crates/relay-transport-libdatachannel",
    "apps/connect",
    "apps/stream",
    "apps/link",
]
exclude = ["apps/plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MPL-2.0"
repository = "https://github.com/DerpcatMusic/relay"
homepage = "https://relay.matari-audio.com"

[workspace.dependencies]
prost = "=0.14.4"
rtrb = "=0.4.0"
rubato = "=4.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
