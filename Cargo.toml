[workspace]
members = ["core", "plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Matari-Audio/relay"

[profile.release]
lto = "thin"

[profile.dev]
debug = "line-tables-only"
incremental = true

# Opus and DTLS are too slow unoptimised for a debug plugin to keep up.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2
