moose-dsp = { path = "../../frameworks/moose/crates/moose-dsp" }
moose-egui = { path = "../../frameworks/moose/crates/moose-egui" }
moose-font = { path = "../../frameworks/moose/crates/moose-font" }
moose-params = { path = "../../frameworks/moose/crates/moose-params" }
